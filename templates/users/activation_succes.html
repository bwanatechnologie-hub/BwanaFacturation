{% extends 'base.html' %}
{% block content_auth %}
<div class="min-vh-100 d-flex align-items-center justify-content-center"
     style="background: linear-gradient(135deg, #1e3a5f, #2d6a9f);">
    <div class="card p-4 shadow-lg border-0 text-center"
         style="width:100%; max-width:480px; border-radius:20px;">
        <div style="font-size:60px;">✅</div>
        <h3 class="fw-bold mt-3" style="color:#1e3a5f;">Compte activé !</h3>
        <p class="text-muted">
            Votre compte a été activé avec succès.<br>
            Vous pouvez maintenant vous connecter.
        </p>
        <a href="{% url 'connexion' %}"
           class="btn w-100 py-2 fw-bold mt-3"
           style="background:#1e3a5f; color:white; border-radius:10px;">
            Se connecter
        </a>
    </div>
</div>
{% endblock %}
