<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance — Bwana Facturation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body style="background:linear-gradient(135deg,#1e3a5f,#2d6a9f);min-height:100vh;display:flex;align-items:center;justify-content:center;">
<div class="text-center text-white p-4" style="max-width:500px;">
    <div style="font-size:80px;">🔧</div>
    <h2 class="fw-bold mt-3">Site en maintenance</h2>
    <p class="fs-5 opacity-75 mt-3">{{ message }}</p>
    {% if date_fin %}
    <p class="opacity-50 small">Retour prévu le {{ date_fin|date:"d/m/Y à H:i" }}</p>
    {% endif %}
    <hr style="border-color:rgba(255,255,255,0.2);">
    <p class="opacity-50 small">
        <i class="bi bi-tag me-1"></i>Bwana Facturation — BwanaTech
    </p>
</div>
</body>
</html>
